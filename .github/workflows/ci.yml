name: CI

on:
  pull_request:
    branches: [main]
    paths:
      - "cmd/**"
      - "internal/**"
      - "pkg/**"
      - "go.mod"
      - "go.sum"
      - ".golangci.yml"
      - ".github/workflows/ci.yml"
      - ".github/workflows/ci-check.yml"

permissions:
  contents: read
  pull-requests: write

jobs:
  check:
    uses: ./.github/workflows/ci-check.yml
